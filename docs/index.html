<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Small Model Forensics — viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  :root {
    --bg:        #ffffff;
    --ink:       #111111;
    --ink-soft:  #444444;
    --muted:     #888888;
    --rule:      #dddddd;
    --rule-soft: #eeeeee;
    --link:      #2563eb;
    --accent:    #16a34a;
    --code-bg:   #f4f4f4;
    --hover-bg:  #f7f7f7;

    /* data palette — tailwind 600s, distinguishable on white */
    --d1: #2563eb;  /* blue */
    --d2: #dc2626;  /* red */
    --d3: #16a34a;  /* green */
    --d4: #d97706;  /* amber */
    --d5: #7c3aed;  /* violet */
    --d6: #0891b2;  /* cyan */
    --d7: #db2777;  /* pink */
    --d8: #4b5563;  /* slate */
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: 14px;
    line-height: 1.4;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  main {
    max-width: 1320px;
    margin: 0 auto;
    padding: 2rem 1.5rem 3rem;
  }

  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* —————————————————————————————————————————— masthead (matches post.html) */
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0.75rem 1.25rem;
    padding-top: 1rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 2rem;
  }
  .wordmark {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--ink);
  }
  .nav {
    display: flex;
    gap: 0.85rem;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .nav a { color: var(--muted); }
  .nav a:hover { color: var(--ink); text-decoration: none; }
  .nav a.active { color: var(--ink); font-weight: 700; }

  .stat-strip {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    font-size: 0.8rem;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  #meta { display: inline-flex; align-items: center; gap: 0.4rem; }
  #meta::before {
    content: '';
    width: 7px; height: 7px;
    background: var(--accent);
    border-radius: 50%;
    display: inline-block;
  }
  button#reload {
    font-family: inherit;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--rule);
    padding: 0.3rem 0.7rem;
    cursor: pointer;
    transition: background 120ms, border-color 120ms;
  }
  button#reload:hover { background: var(--code-bg); border-color: var(--ink); }

  /* —————————————————————————————————————————— console */
  .console {
    display: grid;
    grid-template-columns: 1.6fr 1fr 1fr;
    gap: 1.75rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 1.5rem;
  }
  .group { display: flex; flex-direction: column; gap: 0.6rem; min-width: 0; }
  .group-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink);
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.4rem;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 0.6rem 1.1rem; }
  .controls label {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    min-width: 0;
  }
  .controls select {
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--ink);
    background: var(--bg);
    border: none;
    border-bottom: 1px solid var(--ink);
    padding: 0.15rem 1rem 0.2rem 0;
    text-transform: none;
    letter-spacing: 0;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6' fill='none' stroke='%23111111' stroke-width='1.2'><path d='M1 1l4 4 4-4'/></svg>");
    background-repeat: no-repeat;
    background-position: right 2px center;
    background-size: 8px 6px;
    cursor: pointer;
    border-radius: 0;
  }
  .controls select:focus {
    outline: none;
    border-bottom-color: var(--link);
    color: var(--link);
  }

  /* —————————————————————————————————————————— figures */
  figure { margin: 0 0 1.75rem; }
  .figcap {
    display: flex;
    align-items: baseline;
    gap: 0.85rem;
    flex-wrap: wrap;
    padding-bottom: 0.5rem;
    margin-bottom: 0.85rem;
    border-bottom: 1px solid var(--rule);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .fig-num { color: var(--muted); flex-shrink: 0; }
  .fig-title { color: var(--ink); font-weight: 700; flex: 1; min-width: 0; }
  .fig-meta { color: var(--muted); text-align: right; flex-shrink: 0; }

  #plot  { width: 100%; height: 60vh; min-height: 440px; }
  #plot2 { width: 100%; height: 48vh; min-height: 360px; }

  .caption {
    font-size: 0.8rem;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-top: 0.85rem;
    padding: 0.5rem 0 0.5rem 0.85rem;
    border-left: 2px solid var(--rule);
    display: grid;
    gap: 0.4rem;
    max-width: 920px;
  }
  .caption .ax {
    display: inline-block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 700;
    color: var(--muted);
    margin-right: 0.5rem;
    min-width: 0.9rem;
  }
  .caption .name { color: var(--ink); font-weight: 700; margin-right: 0.25rem; }
  .caption .sep { color: var(--muted); margin: 0 0.4rem; }
  .axis-legend { margin-bottom: 2.5rem; }

  /* —————————————————————————————————————————— summary */
  .summary { overflow-x: auto; }
  .summary table {
    border-collapse: collapse;
    font-size: 0.8rem;
    width: 100%;
    max-width: 780px;
  }
  .summary th, .summary td {
    padding: 0.4rem 0.85rem 0.4rem 0;
    text-align: right;
    border-bottom: 1px solid var(--rule-soft);
  }
  .summary thead th {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink);
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.45rem;
  }
  .summary th:first-child, .summary td:first-child {
    text-align: left;
    padding-right: 1.25rem;
    white-space: nowrap;
  }
  .summary tbody tr:hover td { background: var(--hover-bg); }
  .summary .swatch {
    display: inline-block;
    width: 9px; height: 9px;
    background: currentColor;
    margin-right: 0.55em;
    vertical-align: -1px;
  }

  /* —————————————————————————————————————————— colophon */
  .colophon {
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem 1rem;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .colophon .piece { display: inline-flex; align-items: center; gap: 0.5rem; }
  .colophon .dot { color: var(--rule); }

  /* responsive */
  @media (max-width: 1100px) { .console { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 720px) {
    main { padding: 1.5rem 1rem 2.5rem; }
    .console { grid-template-columns: 1fr; gap: 1.25rem; }
    .figcap { flex-wrap: wrap; }
  }

  .loading { opacity: 0.55; pointer-events: none; transition: opacity 200ms; }
</style>
</head>
<body>
<main>

  <header class="masthead">
    <a href="index.html" class="wordmark">Small Model Forensics</a>
    <nav class="nav">
      <a href="index.html" class="active">viewer</a><a href="post.html">post</a>
    </nav>
    <div class="stat-strip">
      <span id="meta">— rows</span>
      <button id="reload" title="reload data">⟳ reload</button>
    </div>
  </header>

  <section class="console" aria-label="filters and axes">
    <div class="group">
      <div class="group-label">selection</div>
      <div class="controls">
        <label>sweep
          <select id="sweep"><option value="">all</option></select>
        </label>
        <label>context
          <select id="context_type"><option value="">all</option></select>
        </label>
        <label>provider
          <select id="provider"><option value="">all</option></select>
        </label>
        <label>prompt
          <select id="prompt_kind"><option value="">all</option></select>
        </label>
        <label>is_test
          <select id="is_test">
            <option value="">all</option>
            <option value="1" selected>test only</option>
            <option value="0">production only</option>
          </select>
        </label>
      </div>
    </div>

    <div class="group">
      <div class="group-label">axes</div>
      <div class="controls">
        <label>x · independent
          <select id="x_axis">
            <option value="input_tokens" selected>input_tokens</option>
            <option value="prompt_bytes">prompt_bytes</option>
            <option value="request_body_bytes">request_body_bytes</option>
          </select>
        </label>
        <label>y · dependent
          <select id="y_axis">
            <option value="first_content_delta_ms" selected>first_content_delta_ms (TTFT)</option>
            <option value="first_response_byte_ms">first_response_byte_ms</option>
            <option value="first_stream_event_ms">first_stream_event_ms</option>
            <option value="total_ms">total_ms</option>
            <option value="decode_ms_per_token">decode_ms_per_token (post-TTFT)</option>
            <option value="ttft_ms_per_input_token">ttft_ms_per_input_token</option>
            <option value="output_tokens">output_tokens</option>
            <option value="reasoning_tokens">reasoning_tokens</option>
          </select>
        </label>
      </div>
    </div>

    <div class="group">
      <div class="group-label">presentation</div>
      <div class="controls">
        <label>scale
          <select id="scale">
            <option value="log-log" selected>log-log</option>
            <option value="log-x">log x only</option>
            <option value="linear">linear</option>
          </select>
        </label>
        <label>aggregate
          <select id="agg">
            <option value="scatter" selected>scatter all points</option>
            <option value="p10-p90">median ± P10–P90</option>
            <option value="min-max">median ± min–max</option>
            <option value="q1-q3">median ± Q1–Q3 (IQR)</option>
          </select>
        </label>
      </div>
    </div>
  </section>

  <section class="axis-legend caption" aria-label="axis legend">
    <div><span class="ax">x</span><span class="name" id="x-label"></span><span class="sep">—</span><span id="x-desc"></span></div>
    <div><span class="ax">y</span><span class="name" id="y-label"></span><span class="sep">—</span><span id="y-desc"></span></div>
    <div id="prompt-kind-row" hidden><span class="ax">kind</span><span class="name" id="prompt-kind-label"></span><span class="sep">—</span><span id="prompt-kind-desc"></span></div>
  </section>

  <figure id="fig-1">
    <div class="figcap">
      <span class="fig-num">fig. 1</span>
      <span class="fig-title">latency vs. context, all observations</span>
      <span class="fig-meta" id="fig-1-meta"></span>
    </div>
    <div id="plot"></div>
  </figure>

  <figure id="fig-2">
    <div class="figcap">
      <span class="fig-num">fig. 2</span>
      <span class="fig-title">medians per model, log-x bucketed</span>
      <span class="fig-meta">~10 bins per decade</span>
    </div>
    <div id="plot2"></div>
  </figure>

  <figure id="tab-1">
    <div class="figcap">
      <span class="fig-num">tab. 1</span>
      <span class="fig-title">y-axis distribution by model</span>
      <span class="fig-meta">min · P10 · P50 · P90 · max</span>
    </div>
    <div class="summary" id="summary"></div>
  </figure>

  <footer class="colophon">
    <span class="piece"><span>attention</span><span class="dot">·</span><span>prefill scaling sweep viewer</span></span>
    <span class="piece"><span>data via data/calls.json</span><span class="dot">·</span><span>plotly 2.35</span><span class="dot">·</span><span id="rendered-at">—</span></span>
  </footer>

</main>

<script>
const $ = id => document.getElementById(id);

// data palette is read from CSS vars so dark mode is automatic
function readPalette() {
  const cs = getComputedStyle(document.body);
  return ['--d1','--d2','--d3','--d4','--d5','--d6','--d7','--d8']
    .map(k => cs.getPropertyValue(k).trim());
}
function cssVar(name) {
  return getComputedStyle(document.body).getPropertyValue(name).trim();
}
let COLORS = readPalette();

const METRIC_INFO = {
  input_tokens:           { label: 'input_tokens',           desc: 'Provider-reported tokens. Tokenizers differ — compare within (provider, model).' },
  prompt_bytes:           { label: 'prompt_bytes',           desc: 'UTF-8 byte length. Tokenizer-agnostic; fair across providers.' },
  request_body_bytes:     { label: 'request_body_bytes',     desc: 'Full HTTP body (prompt + params + protocol). Proxy for upload cost.' },
  first_content_delta_ms: { label: 'first_content_delta_ms', desc: 'Time to first content token. Best proxy for prefill cost.' },
  first_response_byte_ms: { label: 'first_response_byte_ms', desc: 'Time to first HTTP response byte. Lower bound on TTFT.' },
  first_stream_event_ms:  { label: 'first_stream_event_ms',  desc: 'Time to first SSE event — often metadata, not content.' },
  total_ms:               { label: 'total_ms',               desc: 'Request lifetime: TTFT + decode + egress.' },
  decode_ms_per_token:    { label: 'decode_ms_per_token',    desc: 'Mean per-token decode time post-TTFT. (last−first) / (out−1).' },
  ttft_ms_per_input_token:{ label: 'ttft_ms_per_input_token',desc: 'TTFT / input_tokens. Flat ≈ O(n); rising ≈ O(n²); sub-linear ≈ sparse-suggestive.' },
  output_tokens:          { label: 'output_tokens',          desc: 'Visible content tokens (reasoning stripped).' },
  reasoning_tokens:       { label: 'reasoning_tokens',       desc: 'Reasoning / thinking tokens. Should be 0 here.' },
};

const PROMPT_KIND_INFO = {
  'song-toads':  { label: 'song-lyrics-prompt',  desc: 'Natural English filler + nonce; tail asks for a song about toads.' },
  'random':      { label: 'random',      desc: 'High-entropy hex bytes; tail asks for a long story. Defeats caching and content-aware sparsity.' },
  'needle-p50':  { label: 'needle-prompt-p50',  desc: 'Natural filler with a secret code inserted at 50% position; tail asks model to repeat code then write an essay.' },
};

const METRICS = {
  first_content_delta_ms: r => r.first_content_delta_ms,
  first_response_byte_ms: r => r.first_response_byte_ms,
  total_ms: r => r.total_ms,
  output_tokens: r => r.output_tokens,
  decode_ms_per_token: r => {
    if (r.last_content_delta_ms == null || r.first_content_delta_ms == null) return null;
    const decoded = (r.output_tokens ?? 0) + (r.reasoning_tokens ?? 0);
    if (decoded <= 1) return null;
    return (r.last_content_delta_ms - r.first_content_delta_ms) / (decoded - 1);
  },
  ttft_ms_per_input_token: r => {
    if (r.first_content_delta_ms == null || !r.input_tokens) return null;
    return r.first_content_delta_ms / r.input_tokens;
  },
  input_tokens: r => r.input_tokens,
  prompt_bytes: r => r.prompt_bytes,
  request_body_bytes: r => r.request_body_bytes,
  reasoning_tokens: r => r.reasoning_tokens,
};

// No backend: the full dataset is shipped as a static JSON file (produced by
// `npm run export`). `/api/meta` and `/api/calls` are reproduced client-side
// over ALL_ROWS — meta from all rows, the calls list from status='complete'.
let ALL_ROWS = [];

async function loadAll() {
  const res = await fetch('data/calls.json', { cache: 'no-cache' });
  if (!res.ok) throw new Error(`failed to load data/calls.json: ${res.status}`);
  ALL_ROWS = await res.json();
}

// Mirrors the GROUP BY / DISTINCT logic of the old /api/meta endpoint.
function computeMeta(rows) {
  const bySweep = new Map();
  for (const r of rows) {
    if (r.sweep_id == null) continue;
    let s = bySweep.get(r.sweep_id);
    if (!s) {
      s = { sweep_id: r.sweep_id, started_at: r.created_at,
            n: 0, n_ok: 0, n_test: 0, _ctx: new Set(), _prov: new Set() };
      bySweep.set(r.sweep_id, s);
    }
    s.n += 1;
    if (r.status === 'complete') s.n_ok += 1;
    s.n_test += r.is_test ? 1 : 0;
    if (r.context_type != null) s._ctx.add(r.context_type);
    if (r.provider != null) s._prov.add(r.provider);
    if (r.created_at != null && (s.started_at == null || r.created_at < s.started_at)) {
      s.started_at = r.created_at;
    }
  }
  const sweeps = [...bySweep.values()]
    .map(s => ({
      sweep_id: s.sweep_id, started_at: s.started_at,
      n: s.n, n_ok: s.n_ok, n_test: s.n_test,
      context_types: [...s._ctx].sort().join(','),
      providers: [...s._prov].sort().join(','),
    }))
    .sort((a, b) => String(b.started_at).localeCompare(String(a.started_at)));
  const distinct = key => [...new Set(
    rows.map(r => r[key]).filter(v => v != null && v !== '')
  )].sort();
  return {
    sweeps,
    context_types: distinct('context_type').map(v => ({ context_type: v })),
    providers: distinct('provider').map(v => ({ provider: v })),
    prompt_kinds: distinct('prompt_kind').map(v => ({ prompt_kind: v })),
  };
}

function loadMeta() {
  const meta = computeMeta(ALL_ROWS);
  const sweepSel = $('sweep');
  for (const s of meta.sweeps) {
    const opt = document.createElement('option');
    opt.value = s.sweep_id;
    opt.textContent = `${s.sweep_id}  (n=${s.n}, test=${s.n_test}, ctx=${s.context_types ?? '?'})`;
    sweepSel.appendChild(opt);
  }
  const ctxSel = $('context_type');
  for (const c of meta.context_types ?? []) {
    const opt = document.createElement('option');
    opt.value = c.context_type;
    opt.textContent = c.context_type;
    ctxSel.appendChild(opt);
  }
  const provSel = $('provider');
  for (const p of meta.providers ?? []) {
    const opt = document.createElement('option');
    opt.value = p.provider;
    opt.textContent = p.provider;
    provSel.appendChild(opt);
  }
  const pkSel = $('prompt_kind');
  for (const k of meta.prompt_kinds ?? []) {
    const opt = document.createElement('option');
    opt.value = k.prompt_kind;
    opt.textContent = PROMPT_KIND_INFO[k.prompt_kind]?.label ?? k.prompt_kind;
    pkSel.appendChild(opt);
  }
}

function quantile(sorted, p) {
  if (sorted.length === 0) return null;
  const idx = Math.min(sorted.length - 1, Math.max(0, Math.floor(p * (sorted.length - 1))));
  return sorted[idx];
}

function groupBy(rows, keyFn) {
  const m = new Map();
  for (const r of rows) {
    const k = keyFn(r);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(r);
  }
  return m;
}

// Log-space bucketing: 10 bins per decade (~26% bucket width).
function bucketKey(x) {
  if (!Number.isFinite(x) || x <= 0) return null;
  return Math.round(Math.log10(x) * 10);
}

function geomMean(xs) {
  if (xs.length === 0) return null;
  const s = xs.reduce((acc, v) => acc + Math.log(v), 0);
  return Math.exp(s / xs.length);
}

function aggregateMedian(points) {
  const buckets = new Map();
  for (const p of points) {
    const k = bucketKey(p.x);
    if (k == null) continue;
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(p);
  }
  const out = [];
  for (const pts of buckets.values()) {
    const xs = pts.map(p => p.x).filter(Number.isFinite);
    const ys = pts.map(p => p.y).filter(Number.isFinite).sort((a, b) => a - b);
    if (xs.length === 0 || ys.length === 0) continue;
    out.push({ x: geomMean(xs), y: quantile(ys, 0.5), n: ys.length });
  }
  out.sort((a, b) => a.x - b.x);
  return out;
}

function aggregate(points, mode) {
  if (mode === 'scatter') return { kind: 'scatter', points };
  const buckets = new Map();
  for (const p of points) {
    const k = bucketKey(p.x);
    if (k == null) continue;
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(p);
  }
  const out = [];
  for (const pts of buckets.values()) {
    const xs = pts.map(p => p.x).filter(Number.isFinite);
    const ys = pts.map(p => p.y).filter(Number.isFinite).sort((a, b) => a - b);
    if (xs.length === 0 || ys.length === 0) continue;
    const x = geomMean(xs);
    const y = quantile(ys, 0.5);
    let lo, hi;
    if (mode === 'p10-p90')      { lo = quantile(ys, 0.1);  hi = quantile(ys, 0.9); }
    else if (mode === 'min-max') { lo = ys[0];              hi = ys[ys.length - 1]; }
    else if (mode === 'q1-q3')   { lo = quantile(ys, 0.25); hi = quantile(ys, 0.75); }
    else                          { lo = y; hi = y; }
    out.push({ x, y, lo, hi, n: ys.length });
  }
  out.sort((a, b) => a.x - b.x);
  return { kind: 'aggregated', points: out };
}

// Mirrors the WHERE clause of the old /api/calls endpoint, in-memory.
function loadData() {
  document.body.classList.add('loading');
  const sweep   = $('sweep').value;
  const ctx     = $('context_type').value;
  const prov    = $('provider').value;
  const pk      = $('prompt_kind').value;
  const isTest  = $('is_test').value;
  const rows = ALL_ROWS.filter(r => {
    if (r.status !== 'complete') return false;
    if (sweep && r.sweep_id !== sweep) return false;
    if (ctx && r.context_type !== ctx) return false;
    if (prov && r.provider !== prov) return false;
    if (pk && r.prompt_kind !== pk) return false;
    if ((isTest === '0' || isTest === '1') && r.is_test !== Number(isTest)) return false;
    return true;
  });
  $('meta').textContent = `${rows.length.toLocaleString()} rows`;
  render(rows);
  $('rendered-at').textContent = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' utc';
  document.body.classList.remove('loading');
}

// shared plotly axis style — matches the rest of the page (Space Mono, white-bg)
function buildPlotLayout(xKey, yKey, xType, yType) {
  const ink     = cssVar('--ink');
  const inkSoft = cssVar('--ink-soft');
  const rule    = cssVar('--rule-soft');
  const paper   = cssVar('--bg');
  const FONT    = '"Space Mono", ui-monospace, monospace';

  const axisBase = {
    type: undefined,
    gridcolor: rule,
    zerolinecolor: cssVar('--rule'),
    linecolor: ink,
    linewidth: 1,
    tickcolor: ink,
    ticklen: 5,
    ticks: 'outside',
    tickfont: { family: FONT, size: 10, color: inkSoft },
    titlefont: { family: FONT, size: 11, color: ink },
    automargin: true,
    showline: true,
    mirror: false,
  };

  return {
    font: { family: FONT, color: ink, size: 12 },
    paper_bgcolor: 'rgba(0,0,0,0)',
    plot_bgcolor: 'rgba(0,0,0,0)',
    margin: { t: 14, r: 22, b: 84, l: 80 },
    xaxis: { ...axisBase, title: { text: xKey, standoff: 12 }, type: xType },
    yaxis: { ...axisBase, title: { text: yKey, standoff: 12 }, type: yType },
    legend: {
      orientation: 'h',
      y: -0.24,
      x: 0,
      xanchor: 'left',
      yanchor: 'top',
      font: { family: FONT, size: 10.5, color: ink },
      bgcolor: 'rgba(0,0,0,0)',
      itemwidth: 30,
    },
    hoverlabel: {
      bgcolor: paper,
      bordercolor: ink,
      font: { family: FONT, size: 11, color: ink },
      align: 'left',
    },
    colorway: COLORS,
  };
}

function render(rows) {
  const xKey = $('x_axis').value;
  const yKey = $('y_axis').value;
  const scale = $('scale').value;
  const agg = $('agg').value;

  const xInfo = METRIC_INFO[xKey] ?? { label: xKey, desc: '(no description)' };
  const yInfo = METRIC_INFO[yKey] ?? { label: yKey, desc: '(no description)' };
  $('x-label').textContent = xInfo.label;
  $('x-desc').textContent  = xInfo.desc;
  $('y-label').textContent = yInfo.label;
  $('y-desc').textContent  = yInfo.desc;

  const pkVal = $('prompt_kind').value;
  const pkRow = $('prompt-kind-row');
  if (pkVal && PROMPT_KIND_INFO[pkVal]) {
    pkRow.hidden = false;
    $('prompt-kind-label').textContent = PROMPT_KIND_INFO[pkVal].label;
    $('prompt-kind-desc').textContent  = PROMPT_KIND_INFO[pkVal].desc;
  } else if (pkVal) {
    pkRow.hidden = false;
    $('prompt-kind-label').textContent = pkVal;
    $('prompt-kind-desc').textContent  = '(no description registered for this prompt kind)';
  } else {
    pkRow.hidden = true;
  }

  const xType = (scale === 'log-log' || scale === 'log-x') ? 'log' : 'linear';
  const yType = scale === 'log-log' ? 'log' : 'linear';

  const byModel = groupBy(rows, r => `${r.provider}/${r.model}`);
  $('fig-1-meta').textContent = `${byModel.size} model${byModel.size === 1 ? '' : 's'} · ${agg === 'scatter' ? 'scatter' : agg}`;

  const traces = [];
  let i = 0;
  const modelColors = new Map();
  for (const [name, modelRows] of byModel) {
    const xFn = METRICS[xKey] ?? (r => r[xKey]);
    const yFn = METRICS[yKey] ?? (r => r[yKey]);
    const points = modelRows
      .map(r => ({ x: xFn(r), y: yFn(r), row: r }))
      .filter(p => Number.isFinite(p.x) && Number.isFinite(p.y) && p.x > 0 && p.y > 0);
    const result = aggregate(points, agg);
    const color = COLORS[i++ % COLORS.length];
    modelColors.set(name, color);
    if (result.kind === 'scatter') {
      traces.push({
        x: result.points.map(p => p.x),
        y: result.points.map(p => p.y),
        mode: 'markers',
        type: 'scatter',
        name,
        marker: { color, size: 5, opacity: 0.72, line: { width: 0 } },
        text: result.points.map(p => `id=${p.row.id} r${p.row.repeat_index} out=${p.row.output_tokens} finish=${p.row.finish_reason}`),
        hovertemplate: '<b>%{x:,.0f}</b> → <b>%{y:,.1f}</b><br>%{text}<extra>%{fullData.name}</extra>',
      });
    } else {
      const pts = result.points;
      traces.push({
        x: pts.map(p => p.x),
        y: pts.map(p => p.y),
        error_y: {
          type: 'data',
          symmetric: false,
          array: pts.map(p => p.hi - p.y),
          arrayminus: pts.map(p => p.y - p.lo),
          color,
          thickness: 1.2,
          width: 4,
        },
        mode: 'lines+markers',
        type: 'scatter',
        name,
        marker: { color, size: 7, line: { width: 0 } },
        line: { color, width: 1.6 },
        text: pts.map(p => `n=${p.n}  median=${Math.round(p.y * 1000) / 1000}  lo=${Math.round(p.lo * 1000) / 1000}  hi=${Math.round(p.hi * 1000) / 1000}`),
        hovertemplate: '<b>%{x:,.0f}</b><br>%{text}<extra>%{fullData.name}</extra>',
      });
    }
  }
  Plotly.newPlot('plot', traces, buildPlotLayout(xKey, yKey, xType, yType), { responsive: true, displaylogo: false });

  const medianTraces = [];
  let j = 0;
  for (const [name, modelRows] of byModel) {
    const xFn = METRICS[xKey] ?? (r => r[xKey]);
    const yFn = METRICS[yKey] ?? (r => r[yKey]);
    const points = modelRows
      .map(r => ({ x: xFn(r), y: yFn(r) }))
      .filter(p => Number.isFinite(p.x) && Number.isFinite(p.y) && p.x > 0 && p.y > 0);
    const med = aggregateMedian(points);
    const color = COLORS[j++ % COLORS.length];
    medianTraces.push({
      x: med.map(p => p.x),
      y: med.map(p => p.y),
      mode: 'lines+markers',
      type: 'scatter',
      name,
      marker: { color, size: 6, line: { width: 0 } },
      line: { color, width: 1.8, shape: 'linear' },
      text: med.map(p => `n=${p.n}`),
      hovertemplate: '<b>%{x:,.0f}</b> → <b>%{y:,.1f}</b><br>%{text}<extra>%{fullData.name}</extra>',
    });
  }
  Plotly.newPlot('plot2', medianTraces, buildPlotLayout(xKey, yKey, xType, yType), { responsive: true, displaylogo: false });

  renderSummary(byModel, yKey, modelColors);
}

function renderSummary(byModel, yKey, modelColors) {
  const yFn = METRICS[yKey] ?? (r => r[yKey]);
  let html = '<table><thead><tr>'
    + '<th>model</th><th>n</th><th>min</th><th>P10</th><th>P50</th><th>P90</th><th>max</th>'
    + '</tr></thead><tbody>';
  for (const [name, rows] of byModel) {
    const ys = rows.map(r => yFn(r)).filter(v => Number.isFinite(v)).sort((a,b)=>a-b);
    if (ys.length === 0) continue;
    const f = v => v == null ? '' : Math.round(v).toLocaleString();
    const color = modelColors.get(name) ?? cssVar('--ink');
    html += `<tr>`
      + `<td><span class="swatch" style="color:${color}"></span>${name}</td>`
      + `<td>${ys.length}</td>`
      + `<td>${f(ys[0])}</td>`
      + `<td>${f(quantile(ys,0.1))}</td>`
      + `<td>${f(quantile(ys,0.5))}</td>`
      + `<td>${f(quantile(ys,0.9))}</td>`
      + `<td>${f(ys[ys.length-1])}</td>`
      + `</tr>`;
  }
  html += '</tbody></table>';
  $('summary').innerHTML = html;
}

for (const id of ['sweep','context_type','provider','prompt_kind','is_test','x_axis','y_axis','scale','agg']) {
  $(id).addEventListener('change', loadData);
}
$('reload').addEventListener('click', async () => {
  document.body.classList.add('loading');
  try { await loadAll(); } catch (e) { console.error(e); }
  loadData();
});

(async () => {
  try {
    await loadAll();
    loadMeta();
    loadData();
  } catch (e) {
    console.error(e);
    $('meta').textContent = 'load error — run `npm run export`';
    document.body.classList.remove('loading');
  }
})();
</script>
